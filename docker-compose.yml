version: '3.8'

services:
  app_blue:
    image: ${DOCKER_USER}/node-blue-green:latest
    container_name: app_blue
    ports:
      - "8081:3000"
    environment:
      - PORT=3000
      - VERSION=Blue-1.0.0

  app_green:
    image: ${DOCKER_USER}/node-blue-green:latest
    container_name: app_green
    ports:
      - "8082:3000"
    environment:
      - PORT=3000
      - VERSION=Green-2.0.0

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_blue
      - app_green